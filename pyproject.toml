
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-mlops"
version = "0.1.0"
description = "End-to-end Heart Disease MLOps pipeline"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "prometheus-client>=0.20,<1"
]

[project.optional-dependencies]

training = [
    "ucimlrepo==0.0.7",
    "mlflow>=3.0,<4",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1"
]

dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "httpx>=0.28,<1"
]

notebook = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
