
name: MLOps Model Training

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/data/**"
      - "src/models/**"
      - "api/model_loader.py"
      - "scripts/check_model_quality.py"
      - "pyproject.toml"
      - ".github/workflows/model-training.yml"

permissions:
  contents: read

concurrency:
  group: ml-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-training:
    name: Train, Validate and Package Model
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MODEL_SOURCE: local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[training,dev]"
          python -m pip check

      - name: Verify environment
        run: |
          python --version
          python -c "import sklearn, pandas, mlflow, ucimlrepo; print('ML dependencies ready')"

      - name: Prepare artifact directories
        run: |
          mkdir -p reports models/production

      - name: Download, validate, clean and analyze dataset
        run: |
          python -m src.data.pipeline

      - name: Run baseline training
        run: |
          set -o pipefail
          python -m src.models.train \
            | tee reports/baseline_training.log

      - name: Hyperparameter tuning
        run: |
          python -m src.models.tune \
            --output reports/model_tuning.json

      - name: Enforce model quality gate
        run: |
          python -m scripts.check_model_quality \
            --report reports/model_tuning.json \
            --min-roc-auc 0.80

      - name: Package selected model
        run: |
          python -m src.models.package \
            --tuning reports/model_tuning.json \
            --output models/production

      - name: Verify packaged model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from api.model_loader import load_local_model

          model_dir = Path("models/production")

          loaded = load_local_model(
              model_dir / "model.joblib",
              model_dir / "model_metadata.json",
          )

          metadata = json.loads(
              (model_dir / "model_metadata.json").read_text()
          )

          assert loaded.name == metadata["model_name"]
          assert loaded.version == metadata["model_version"]

          print("Packaged model verified:", loaded.name)
          print("CV ROC-AUC:", metadata["cv_roc_auc"])
          PY

      - name: Write workflow metadata
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          metadata = {
              "git_sha": os.environ["GITHUB_SHA"],
              "git_ref": os.environ["GITHUB_REF"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "python_version": platform.python_version(),
          }

          Path("reports/workflow_metadata.json").write_text(
              json.dumps(metadata, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-training-${{ github.run_id }}
          path: |
            reports/
            models/production/
          if-no-files-found: warn
          retention-days: 14
