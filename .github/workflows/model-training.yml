
name: MLOps Model Training

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/data/**"
      - "src/models/**"
      - "scripts/check_model_quality.py"
      - "requirements*.txt"
      - ".github/workflows/model-training.yml"

permissions:
  contents: read

concurrency:
  group: ml-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-training:
    name: Train, Validate and Package Model
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MODEL_SOURCE: local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
            requirements-mlflow.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-data.txt \
            -r requirements-mlflow.txt
          python -m pip check

      - name: Verify environment
        run: |
          python --version
          python -c "import sklearn, pandas, mlflow; print('ML dependencies ready')"

      - name: Download, validate, clean and analyze dataset
        run: |
          python -m src.data.pipeline

      - name: Run baseline training
        run: |
          python -m src.models.train \
            | tee reports/baseline_training.log

      - name: Hyperparameter tuning
        run: |
          python -m src.models.tune \
            --output reports/model_tuning.json

      - name: Enforce model quality gate
        run: |
          python -m scripts.check_model_quality \
            --report reports/model_tuning.json \
            --min-roc-auc 0.80

      - name: Package selected model
        run: |
          python -m src.models.package \
            --tuning reports/model_tuning.json \
            --output models/production

      - name: Verify packaged model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from api.model_loader import load_local_model

          model_dir = Path("models/production")
          loaded = load_local_model(
              model_dir / "model.joblib",
              model_dir / "model_metadata.json",
          )

          metadata = json.loads(
              (model_dir / "model_metadata.json").read_text()
          )

          assert loaded.name == metadata["model_name"]
          assert loaded.version == metadata["model_version"]

          print("Packaged model verified:", loaded.name)
          PY

      - name: Write workflow metadata
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "git_sha": os.environ["GITHUB_SHA"],
              "git_ref": os.environ["GITHUB_REF"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "python_version": "3.12",
          }

          Path("reports/workflow_metadata.json").write_text(
              json.dumps(metadata, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-training-${{ github.run_id }}
          path: |
            reports/
            models/production/
          if-no-files-found: warn
          retention-days: 14
```

### Why `workflow_dispatch`?

It gives us a manual **Run workflow** button in GitHub Actions. We can retrain on demand instead of only relying on Git events.

The `push` trigger also automatically retrains when the relevant code is changed on `main`.

Notice that the tuning command intentionally does not include `--track-mlflow`. This is because your current MLflow server runs locally on your Mac. We'll connect to a cloud-accessible tracking store later.

## Step 3 — Test the quality gate

We'll verify both success and failure behavior.

First, run:

```bash
python -m scripts.check_model_quality \
  --min-roc-auc 0.80
```

Then intentionally test the failure path:

```bash
python -m scripts.check_model_quality \
  --min-roc-auc 0.99
```

The second command should normally fail based on your previous model results. This is expected and demonstrates that the workflow can stop when the quality threshold is not met.

## Step 4 — Run the complete training flow locally

Before pushing:

```bash
python -m src.data.pipeline
python -m src.models.train
python -m src.models.tune
python -m scripts.check_model_quality
python -m src.models.package
```

Then run:

```bash
python -m pytest -q
python -m ruff check .
```

These commands should work without MLflow running.

## Step 5 — Push to GitHub

Stay on your current CI feature branch if it already contains the latest changes.

```bash
git branch --show-current
git status
```

Add only the new files:

```bash
git add \
  scripts/check_model_quality.py \
  .github/workflows/model-training.yml
```

Commit and push:

```bash
git commit -m "ci: automate ML training and model quality gates"
git push
```

Create a pull request into `main` and merge it after your existing CI checks pass.

Then navigate to [GitHub Actions](https://github.com/satyadeep0987/heart-disease-mlops/actions), select **MLOps Model Training**, and click **Run workflow**.

## Step 6 — Verify the GitHub Actions output

After a successful run, GitHub should provide an artifact containing:

```text
reports/
├── baseline_training.log
├── data_pipeline_manifest.json
├── model_tuning.json
├── workflow_metadata.json
├── figures/
└── ...

models/
└── production/
    ├── model.joblib
    └── model_metadata.json
```

The trained model should be generated entirely on the GitHub runner, not copied from your Mac.

