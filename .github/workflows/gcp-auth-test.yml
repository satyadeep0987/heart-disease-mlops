
name: Verify Google Cloud Authentication

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-gcp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: heart-disease-mlops-511812
          workload_identity_provider: projects/985919962244/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-artifact-pusher@heart-disease-mlops-511812.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify identity
        run: |
          gcloud config get-value project

      - name: Verify Artifact Registry access
        run: |
          gcloud artifacts repositories describe heart-disease-images \
            --project=heart-disease-mlops-511812 \
            --location=asia-south1
